<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PopcornPicks</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
        <link rel="stylesheet" href="app.css">
    </head>

    <body>
        <header>
            <a href="index.html" class="brand-logo">
                <i class="bi bi-film"></i> PopcornPicks
            </a>
            <div class="nav-pills">
                <ul class="nav">
                    <li class="nav-item"><a href="index.html" class="nav-link active rounded-pill"><i class="bi bi-fire"></i> Trending</a></li>
                    <li class="nav-item"><a href="explore.html" class="nav-link rounded-pill"><i class="bi bi-search"></i> Explore</a></li>
                    <li class="nav-item"><a href="watchlist.html" class="nav-link rounded-pill"><i class="bi bi-bookmark-star-fill"></i> Watchlist</a></li>
                
                </ul>
            </div>
            <div class="user-actions">
                <a href="profile.html" id="profile-btn" style="display:none;">
                    <button class="btn btn-outline-secondary rounded-pill">
                    <i class="bi bi-person"></i>
                    </button>
                </a>
                <a href="login.html" id="login-btn">
                    <button class="btn btn-outline-secondary rounded-pill">
                    <i class="bi bi-box-arrow-right"></i> Login
                    </button>
                </a>
            </div>
            
        </header>
    

        <section class="hero d-flex flex-column align-items-center text-center">
            <h1 class="display-1" 
            style="font-family: 'Arial', sans-serif; color: #fff;
            margin-top: 30px; margin-bottom: 50px; font-weight: bold;">Top Movies</h1>
            <div id="movie-container" class="movie-grid mt-4"></div>
        </section>




        <script src="script.js"></script>
        <script src="auth.js"></script>
        <script>
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('profile-btn').style.display = 'block';
            }
        </script>

    </body>
</html>
